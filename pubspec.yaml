name: parin_litner
description: Talent Litner - a stable multilingual Leitner flashcard app.
publish_to: 'none'
version: 7.3.0+23

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  audioplayers: '>=6.7.1 <6.8.0'
  vibration: ^3.1.8
  url_launcher: ^6.3.2
  image: 4.10.0 # Pin to the last image build compatible with pdf 3.11.x/archive 4.0.x.
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/parin_litner_icon.png
    - assets/audio/
