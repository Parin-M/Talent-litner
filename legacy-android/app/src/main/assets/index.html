<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3f51b5">
  <title>Talent Litner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-light">
  <header id="app-header">
    <button id="header-back" class="icon-button" type="button" aria-label="Back" style="display:none" data-action="back">‹</button>
    <div class="brand-mark">PL</div>
    <div class="brand-title">
      <div class="brand-name">Talent Litner</div>
      <div id="header-subtitle" class="brand-subtitle">Learn a little every day</div>
    </div>
    <button class="icon-button" type="button" aria-label="Settings" data-action="goto" data-page="settings">⚙</button>
  </header>
  <div id="app-notice" role="status" aria-live="polite"></div>
  <main id="content" tabindex="-1"><div class="loading">Talent Litner</div></main>
  <nav id="bottom-nav" aria-label="Main navigation">
    <button type="button" data-action="goto" data-page="home"><span>⌂</span><small>Home</small></button>
    <button type="button" data-action="study-all"><span>▣</span><small>Study</small></button>
    <button type="button" data-action="goto" data-page="focus"><span>◷</span><small>Focus</small></button>
    <button type="button" data-action="goto" data-page="stats"><span>▥</span><small>Stats</small></button>
  </nav>
  <div id="modal-root"></div>
  <script src="i18n.js"></script>
  <script src="palettes.js"></script>
  <script src="app.js"></script>
</body>
</html>
