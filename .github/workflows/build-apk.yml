name: Build Parin Litner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, pourya-refresh-2026, study-controls-i18n-metro-20261010]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.parin .
          # The Flutter 3.35 engine requires Android 7.0 (API 24).
          # Android 4.0 support is provided by a separate native legacy APK.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          source = p.read_text()
          source, replacements = re.subn(
              r'(?m)^(\s*)minSdk\s*=\s*flutter\.minSdkVersion\s*$',
              r'\g<1>minSdk = 24',
              source,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('Could not set Android minSdk to 24 in generated Gradle file.')
          p.write_text(source)
          if not re.search(r'(?m)^\s*minSdk\s*=\s*24\s*$', source):
              raise SystemExit('Android minSdk 24 verification failed.')
          print('Flutter Android minimum SDK: 24 (Android 7.0 Nougat)')
          PY
          rm -rf test

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android release metadata and ephemeral signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="parin_litner"','android:label="Parin Litner"')
          p.write_text(s)
          print('Android package: com.parin.parin_litner')
          PY
          test -f android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q '^package com.parin.parin_litner' android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          keytool -genkeypair -v -keystore android/parin-release.jks -storepass changeit -keypass changeit -alias parinlitner -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Parin Litner, OU=Release, O=Parin, L=Internet, ST=NA, C=US'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          marker='android {\n'
          signing='''android {\n    signingConfigs {\n        create("release") {\n            storeFile = file("../parin-release.jks")\n            storePassword = "changeit"\n            keyAlias = "parinlitner"\n            keyPassword = "changeit"\n        }\n    }\n'''
          if marker not in s: raise SystemExit('android block not found')
          s=s.replace(marker, signing, 1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          print('Ephemeral release signing configured for this CI run.')
          PY

      - name: Install Parin Litner assets
        run: |
          mkdir -p assets/audio
          test -s assets/parin_litner_icon.png
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          import zlib
          from pathlib import Path

          SR = 22050
          DURATION = 12
          N = SR * DURATION
          OUT = Path('assets/audio')
          random.seed(20260912)

          def write_track(name, generator):
              path = OUT / name
              with wave.open(str(path), 'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(SR)
                  frames = bytearray()
                  for i in range(N):
                      value = max(-1.0, min(1.0, generator(i / SR, i)))
                      frames += struct.pack('<h', int(value * 23000))
                  w.writeframes(frames)
              print(path, path.stat().st_size, 'bytes')

          def soft_env(t):
              phase = t % DURATION
              return min(1.0, phase / 1.8, (DURATION - phase) / 1.8)

          def lofi(t, i):
              e = soft_env(t)
              slow = 0.5 + 0.5 * math.sin(2 * math.pi * t / 7.0)
              chord = (
                  0.28 * math.sin(2 * math.pi * 174.61 * t) +
                  0.20 * math.sin(2 * math.pi * 261.63 * t) +
                  0.13 * math.sin(2 * math.pi * 329.63 * t)
              )
              bell = 0.05 * math.sin(2 * math.pi * 523.25 * t) * (0.5 + 0.5 * math.sin(2 * math.pi * t / 4.0))
              return 0.42 * e * (0.72 + 0.28 * slow) * (chord + bell)

          rain_state = 0.0
          def rainy(t, i):
              global rain_state
              white = random.uniform(-1.0, 1.0)
              rain_state = 0.985 * rain_state + 0.015 * white
              texture = white - rain_state
              drone = 0.16 * math.sin(2 * math.pi * 98.0 * t) + 0.08 * math.sin(2 * math.pi * 147.0 * t)
              return 0.26 * texture + drone

          def deep(t, i):
              pulse = 0.5 + 0.5 * math.sin(2 * math.pi * t / 8.0)
              drone = 0.30 * math.sin(2 * math.pi * 110.0 * t) + 0.16 * math.sin(2 * math.pi * 220.0 * t)
              pad = 0.08 * math.sin(2 * math.pi * 164.81 * t) * pulse
              return 0.62 * (0.75 + 0.25 * pulse) * (drone + pad)

          write_track('lofi_night.wav', lofi)
          write_track('rainy_focus.wav', rainy)
          write_track('deep_focus.wav', deep)

          # A dedicated audible timer alarm, separate from the ambient focus tracks.
          alarm_path = OUT / 'focus_alarm.wav'
          alarm_segments = [(880.0, .22), (0.0, .10), (660.0, .24),
                            (0.0, .10), (880.0, .34), (0.0, .20)] * 2
          with wave.open(str(alarm_path), 'wb') as alarm:
              alarm.setnchannels(1)
              alarm.setsampwidth(2)
              alarm.setframerate(SR)
              frames = bytearray()
              for frequency, duration in alarm_segments:
                  count = int(SR * duration)
                  for i in range(count):
                      if frequency == 0.0:
                          sample = 0.0
                      else:
                          fade_in = min(1.0, i / max(1.0, SR * .012))
                          fade_out = min(1.0, (count - i - 1) / max(1.0, SR * .025))
                          envelope = min(fade_in, fade_out)
                          sample = .78 * envelope * math.sin(2 * math.pi * frequency * i / SR)
                      frames += struct.pack('<h', int(max(-1.0, min(1.0, sample)) * 32767))
              alarm.writeframes(frames)
          print(alarm_path, alarm_path.stat().st_size, 'bytes')

          b=open('assets/parin_litner_icon.png','rb').read(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
          pos=8
          while pos<len(b):
              n=struct.unpack('>I',b[pos:pos+4])[0]; t=b[pos+4:pos+8]; end=pos+12+n; assert end<=len(b)
              assert zlib.crc32(t+b[pos+8:pos+8+n])&0xffffffff==struct.unpack('>I',b[pos+8+n:pos+12+n])[0]
              pos=end
              if t==b'IEND': break
          print('Logo OK:',len(b))
          PY
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp assets/parin_litner_icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done

      - name: Verify Flutter minimum SDK (Android 7+)
        run: grep -Eq '^\s*minSdk = 24\s*$' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Release security hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text(errors='ignore') for p in Path('android').rglob('*.xml'))
          banned=['SYSTEM_ALERT_WINDOW','REQUEST_INSTALL_PACKAGES','QUERY_ALL_PACKAGES','MANAGE_EXTERNAL_STORAGE','READ_SMS','RECEIVE_SMS','SEND_SMS','BIND_ACCESSIBILITY_SERVICE','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','READ_CALL_LOG','WRITE_CALL_LOG','RECORD_AUDIO']
          bad=[x for x in banned if x in text]
          if bad: raise SystemExit('Unexpected sensitive permissions: '+', '.join(bad))
          print('No sensitive Android permissions declared.')
          PY
          grep -RniE 'SYSTEM_ALERT_WINDOW|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|READ_SMS|RECEIVE_SMS|SEND_SMS|BIND_ACCESSIBILITY_SERVICE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CALL_LOG|WRITE_CALL_LOG|RECORD_AUDIO' lib android || true

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Flutter APK build failed (attempt $attempt); retrying in ${delay}s for transient repository/Gradle failures."
              sleep "$delay"
            fi
          done
          echo "Flutter APK build failed after three attempts." >&2
          exit 1

      - name: Build Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build appbundle --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Flutter AAB build failed (attempt $attempt); retrying in ${delay}s for transient repository/Gradle failures."
              sleep "$delay"
            fi
          done
          echo "Flutter AAB build failed after three attempts." >&2
          exit 1

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          python3 - "$APK" "$AAB" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])
          aab = Path(sys.argv[2])

          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt APK entry: {bad}')
              names = set(z.namelist())
              if not any(name == 'classes.dex' or (name.startswith('classes') and name.endswith('.dex')) for name in names):
                  raise SystemExit('APK does not contain a dex file')
              for track in ('lofi_night.wav', 'rainy_focus.wav', 'deep_focus.wav', 'focus_alarm.wav'):
                  expected = f'assets/flutter_assets/assets/audio/{track}'
                  if expected not in names:
                      raise SystemExit(f'APK missing bundled audio asset: {expected}')

          with zipfile.ZipFile(aab) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt AAB entry: {bad}')
              names = set(z.namelist())
              required = 'base/manifest/AndroidManifest.xml'
              if required not in names:
                  raise SystemExit(f'AAB missing {required}')
              if not any(name.endswith('/assets/flutter_assets/assets/audio/focus_alarm.wav') for name in names):
                  raise SystemExit('AAB missing bundled focus alarm asset')

          print('ZIP structure and bundled audio verification: OK')
          PY

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK: $(du -h "$APK" | cut -f1)"
          echo "AAB: $(du -h "$AAB" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  build-legacy-android4:
    name: Build native Android 4.0 compatibility APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate legacy web assets
        run: |
          node --check legacy-android/app/src/main/assets/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('legacy-android/app/src/main/assets')
          translations = json.loads((root / 'translations.json').read_text())
          themes = json.loads((root / 'themes.json').read_text())
          assert len(translations) == 21, f'Expected 21 languages, got {len(translations)}'
          assert len(themes) == 50, f'Expected 50 themes, got {len(themes)}'
          index = (root / 'index.html').read_text()
          for script in ('i18n.js', 'palettes.js', 'app.js'):
              assert script in index, f'Missing script reference: {script}'
          print(f'Legacy assets verified: {len(translations)} languages, {len(themes)} themes')
          PY

      - name: Install Android 4 compatible build SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-28" "build-tools;28.0.3"

      - name: Setup Java 8 for the legacy Gradle toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup legacy Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Verify Android 4.0 minimum SDK
        run: |
          grep -q 'minSdkVersion 14' legacy-android/app/build.gradle
          grep -q 'android:minSdkVersion="14"' legacy-android/app/src/main/AndroidManifest.xml

      - name: Build native legacy APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle -p legacy-android --no-daemon clean assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Legacy Gradle build failed (attempt $attempt); retrying in ${delay}s. This can recover from Maven Central rate limits."
              sleep "$delay"
            fi
          done
          echo "Legacy Gradle build failed after three attempts." >&2
          exit 1

      - name: Verify APK package and minimum SDK
        run: |
          set -euo pipefail
          APK=legacy-android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging "$APK" | grep -q "sdkVersion:'14'"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging "$APK" | grep -q "package: name='com.parin.parin_litner.legacy'"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'com.parin.parin_litner.MainActivity'
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              bad = z.testzip()
              if bad: raise SystemExit('Corrupt APK entry: ' + bad)
              names = set(z.namelist())
              for asset in ('assets/index.html','assets/app.js','assets/i18n.js','assets/palettes.js'):
                  if asset not in names: raise SystemExit('Missing legacy asset: ' + asset)
              if 'classes.dex' not in names: raise SystemExit('APK missing classes.dex')
          print('Android 4 APK integrity check: OK')
          PY

      - name: Upload Android 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-android4-legacy-apk
          path: legacy-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
