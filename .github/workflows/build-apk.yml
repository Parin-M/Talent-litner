name: Build Parin Litner

concurrency:
  group: parin-litner-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.parin .
          # The Flutter 3.35 engine requires Android 7.0 (API 24).
          # Older Android versions are not targeted; minimum supported Android is API 24.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          source = p.read_text()
          source, replacements = re.subn(
              r'(?m)^(\s*)minSdk\s*=\s*flutter\.minSdkVersion\s*$',
              r'\g<1>minSdk = 24',
              source,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('Could not set Android minSdk to 24 in generated Gradle file.')
          p.write_text(source)
          if not re.search(r'(?m)^\s*minSdk\s*=\s*24\s*$', source):
              raise SystemExit('Android minSdk 24 verification failed.')
          print('Flutter Android minimum SDK: 24 (Android 7.0 Nougat)')
          PY
          rm -rf test

      - name: Generate quick-review Android home widget
        run: |
          python3 - <<'PY'
          from pathlib import Path

          package_dir = Path('android/app/src/main/kotlin/com/parin/parin_litner')
          package_dir.mkdir(parents=True, exist_ok=True)
          main = package_dir / 'MainActivity.kt'
          main.write_text(r'''package com.parin.parin_litner

          import android.content.Context
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "parin_litner/quick_widget")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "syncCards" -> {
                                  val payload = call.argument<String>("payload") ?: "{}"
                                  getSharedPreferences("quick_review_widget", Context.MODE_PRIVATE)
                                      .edit().putString("payload", payload).apply()
                                  QuickReviewWidgetProvider.refreshAll(this)
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          ''')

          provider = package_dir / 'QuickReviewWidgetProvider.kt'
          provider.write_text(r'''package com.parin.parin_litner

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.view.Gravity
          import android.widget.RemoteViews
          import org.json.JSONArray
          import org.json.JSONObject

          class QuickReviewWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (id in appWidgetIds) updateOne(context, manager, id)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  when (intent.action) {
                      ACTION_TOGGLE -> prefs.edit().putBoolean("revealed", !prefs.getBoolean("revealed", false)).apply()
                      ACTION_NEXT -> {
                          val count = selectedCards(context).length()
                          if (count > 0) prefs.edit().putInt("index", (prefs.getInt("index", 0) + 1) % count).putBoolean("revealed", false).apply()
                      }
                  }
                  if (intent.action == ACTION_TOGGLE || intent.action == ACTION_NEXT) refreshAll(context)
              }

              companion object {
                  private const val PREFS = "quick_review_widget"
                  private const val ACTION_TOGGLE = "com.parin.parin_litner.QUICK_TOGGLE"
                  private const val ACTION_NEXT = "com.parin.parin_litner.QUICK_NEXT"
                  private const val FLAG_UPDATE_IMMUTABLE = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

                  fun refreshAll(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, QuickReviewWidgetProvider::class.java))
                      if (ids.isNotEmpty()) for (id in ids) updateOne(context, manager, id)
                  }

                  private fun selectedCards(context: Context): JSONArray {
                      val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("payload", "{}") ?: "{}"
                      val payload = try { JSONObject(raw) } catch (_: Exception) { JSONObject() }
                      val all = payload.optJSONArray("cards") ?: JSONArray()
                      val due = JSONArray()
                      for (i in 0 until all.length()) {
                          val card = all.optJSONObject(i)
                          if (card != null && card.optBoolean("due", false)) due.put(card)
                      }
                      return if (due.length() > 0) due else all
                  }

                  private fun updateOne(context: Context, manager: AppWidgetManager, widgetId: Int) {
                      val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      val raw = prefs.getString("payload", "{}") ?: "{}"
                      val payload = try { JSONObject(raw) } catch (_: Exception) { JSONObject() }
                      val labels = payload.optJSONObject("labels") ?: JSONObject()
                      val cards = selectedCards(context)
                      val views = RemoteViews(context.packageName, R.layout.quick_review_widget)
                      val hasCards = cards.length() > 0
                      val index = if (hasCards) Math.floorMod(prefs.getInt("index", 0), cards.length()) else 0
                      val revealed = hasCards && prefs.getBoolean("revealed", false)
                      val card = if (hasCards) cards.optJSONObject(index) ?: JSONObject() else JSONObject()
                      val title = labels.optString("title", "PARIN LITNER · QUICK REVIEW")
                      val empty = labels.optString("empty", "Create a few flashcards first.")
                      views.setTextViewText(R.id.quick_title, title)
                      views.setTextViewText(R.id.quick_question, if (hasCards) card.optString(if (revealed) "back" else "front", empty) else empty)
                      views.setTextViewText(R.id.quick_deck, if (hasCards) card.optString("deck", "") else "")
                      val allCards = payload.optJSONArray("cards") ?: JSONArray()
                      var dueCount = 0
                      for (i in 0 until allCards.length()) {
                          if (allCards.optJSONObject(i)?.optBoolean("due", false) == true) dueCount++
                      }
                      val countLabel = labels.optString(if (dueCount > 0) "due" else "all", if (dueCount > 0) "Due today" else "cards")
                      views.setTextViewText(R.id.quick_status, if (hasCards) (index + 1).toString() + "/" + cards.length().toString() + " · " + countLabel else "")
                      views.setTextViewText(R.id.quick_toggle, labels.optString(if (revealed) "hide" else "reveal", if (revealed) "Hide" else "Reveal"))
                      views.setTextViewText(R.id.quick_next, labels.optString("next", "Next"))
                      views.setTextViewText(R.id.quick_open, labels.optString("open", "Open app"))
                      val rtl = payload.optBoolean("isRtl", false)
                      val alignment = if (rtl) Gravity.RIGHT or Gravity.CENTER_VERTICAL else Gravity.LEFT or Gravity.CENTER_VERTICAL
                      views.setInt(R.id.quick_question, "setGravity", alignment)
                      views.setInt(R.id.quick_deck, "setGravity", if (rtl) Gravity.RIGHT else Gravity.LEFT)

                      val toggle = Intent(context, QuickReviewWidgetProvider::class.java).setAction(ACTION_TOGGLE)
                      val next = Intent(context, QuickReviewWidgetProvider::class.java).setAction(ACTION_NEXT)
                      views.setOnClickPendingIntent(R.id.quick_toggle, PendingIntent.getBroadcast(context, widgetId + 1001, toggle, FLAG_UPDATE_IMMUTABLE))
                      views.setOnClickPendingIntent(R.id.quick_question, PendingIntent.getBroadcast(context, widgetId + 1001, toggle, FLAG_UPDATE_IMMUTABLE))
                      views.setOnClickPendingIntent(R.id.quick_next, PendingIntent.getBroadcast(context, widgetId + 2001, next, FLAG_UPDATE_IMMUTABLE))
                      val launch = context.packageManager.getLaunchIntentForPackage(context.packageName)
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          views.setOnClickPendingIntent(R.id.quick_open, PendingIntent.getActivity(context, widgetId + 3001, launch, FLAG_UPDATE_IMMUTABLE))
                      }
                      manager.updateAppWidget(widgetId, views)
                  }
              }
          }
          ''')

          res = Path('android/app/src/main/res')
          (res / 'layout').mkdir(parents=True, exist_ok=True)
          (res / 'drawable').mkdir(parents=True, exist_ok=True)
          (res / 'xml').mkdir(parents=True, exist_ok=True)

          (res / 'layout/quick_review_widget.xml').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/quick_widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:minHeight="150dp"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/quick_review_widget_bg">
              <TextView
                  android:id="@+id/quick_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="PARIN LITNER · QUICK REVIEW"
                  android:textColor="#FFFFFFFF"
                  android:textSize="12sp"
                  android:fontFamily="sans-serif-medium"
                  android:maxLines="1"
                  android:ellipsize="end" />
              <TextView
                  android:id="@+id/quick_status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:textColor="#D9FFFFFF"
                  android:textSize="10sp"
                  android:maxLines="1" />
              <TextView
                  android:id="@+id/quick_deck"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:textColor="#FFFFFFFF"
                  android:textSize="11sp"
                  android:maxLines="1"
                  android:ellipsize="end" />
              <TextView
                  android:id="@+id/quick_question"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="center_vertical|start"
                  android:text="Create a few flashcards first."
                  android:textColor="#FFFFFFFF"
                  android:textSize="17sp"
                  android:fontFamily="sans-serif-medium"
                  android:maxLines="3"
                  android:ellipsize="end"
                  android:textDirection="firstStrong" />
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <TextView
                      android:id="@+id/quick_toggle"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1.1"
                      android:gravity="center"
                      android:text="Reveal"
                      android:textColor="#FFFFFFFF"
                      android:textSize="11sp"
                      android:fontFamily="sans-serif-medium"
                      android:background="@android:color/transparent"
                      android:maxLines="1"
                      android:ellipsize="end" />
                  <TextView
                      android:id="@+id/quick_next"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="0.8"
                      android:gravity="center"
                      android:text="Next"
                      android:textColor="#FFFFFFFF"
                      android:textSize="11sp"
                      android:fontFamily="sans-serif-medium"
                      android:background="@android:color/transparent"
                      android:maxLines="1"
                      android:ellipsize="end" />
                  <TextView
                      android:id="@+id/quick_open"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:gravity="center"
                      android:text="Open app"
                      android:textColor="#FFFFFFFF"
                      android:textSize="11sp"
                      android:fontFamily="sans-serif-medium"
                      android:background="@android:color/transparent"
                      android:maxLines="1"
                      android:ellipsize="end" />
              </LinearLayout>
          </LinearLayout>
          ''')

          (res / 'drawable/quick_review_widget_bg.xml').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FF0078D4" />
              <corners android:radius="0dp" />
          </shape>
          ''')

          (res / 'xml/quick_review_widget_info.xml').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="150dp"
              android:minResizeWidth="220dp"
              android:minResizeHeight="130dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/quick_review_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          ''')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          if 'QuickReviewWidgetProvider' not in source:
              receiver = '''
                  <receiver android:name=".QuickReviewWidgetProvider" android:label="Parin Litner Quick Review" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.parin.parin_litner.QUICK_TOGGLE" />
                          <action android:name="com.parin.parin_litner.QUICK_NEXT" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/quick_review_widget_info" />
                  </receiver>
              '''
              if '</application>' not in source:
                  raise SystemExit('Cannot register widget: application closing tag is missing.')
              source = source.replace('</application>', receiver + '\\n</application>', 1)
              manifest.write_text(source)
          print('Quick-review home-screen widget generated.')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android release metadata and ephemeral signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="parin_litner"','android:label="Parin Litner"')
          p.write_text(s)
          print('Android package: com.parin.parin_litner')
          PY
          test -f android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          grep -q '^package com.parin.parin_litner' android/app/src/main/kotlin/com/parin/parin_litner/MainActivity.kt
          keytool -genkeypair -v -keystore android/parin-release.jks -storepass changeit -keypass changeit -alias parinlitner -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Parin Litner, OU=Release, O=Parin, L=Internet, ST=NA, C=US'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          marker='android {\n'
          signing='''android {\n    signingConfigs {\n        create("release") {\n            storeFile = file("../parin-release.jks")\n            storePassword = "changeit"\n            keyAlias = "parinlitner"\n            keyPassword = "changeit"\n        }\n    }\n'''
          if marker not in s: raise SystemExit('android block not found')
          s=s.replace(marker, signing, 1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          print('Ephemeral release signing configured for this CI run.')
          PY

      - name: Install Parin Litner assets
        run: |
          mkdir -p assets/audio
          test -s assets/parin_litner_icon.png
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          import zlib
          from pathlib import Path

          SR = 22050
          DURATION = 12
          N = SR * DURATION
          OUT = Path('assets/audio')
          random.seed(20260912)

          def write_track(name, generator):
              path = OUT / name
              with wave.open(str(path), 'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(SR)
                  frames = bytearray()
                  for i in range(N):
                      value = max(-1.0, min(1.0, generator(i / SR, i)))
                      frames += struct.pack('<h', int(value * 23000))
                  w.writeframes(frames)
              print(path, path.stat().st_size, 'bytes')

          def soft_env(t):
              phase = t % DURATION
              return min(1.0, phase / 1.8, (DURATION - phase) / 1.8)

          def lofi(t, i):
              e = soft_env(t)
              slow = 0.5 + 0.5 * math.sin(2 * math.pi * t / 7.0)
              chord = (
                  0.28 * math.sin(2 * math.pi * 174.61 * t) +
                  0.20 * math.sin(2 * math.pi * 261.63 * t) +
                  0.13 * math.sin(2 * math.pi * 329.63 * t)
              )
              bell = 0.05 * math.sin(2 * math.pi * 523.25 * t) * (0.5 + 0.5 * math.sin(2 * math.pi * t / 4.0))
              return 0.42 * e * (0.72 + 0.28 * slow) * (chord + bell)

          rain_state = 0.0
          def rainy(t, i):
              global rain_state
              white = random.uniform(-1.0, 1.0)
              rain_state = 0.985 * rain_state + 0.015 * white
              texture = white - rain_state
              drone = 0.16 * math.sin(2 * math.pi * 98.0 * t) + 0.08 * math.sin(2 * math.pi * 147.0 * t)
              return 0.26 * texture + drone

          def deep(t, i):
              pulse = 0.5 + 0.5 * math.sin(2 * math.pi * t / 8.0)
              drone = 0.30 * math.sin(2 * math.pi * 110.0 * t) + 0.16 * math.sin(2 * math.pi * 220.0 * t)
              pad = 0.08 * math.sin(2 * math.pi * 164.81 * t) * pulse
              return 0.62 * (0.75 + 0.25 * pulse) * (drone + pad)

          write_track('lofi_night.wav', lofi)
          write_track('rainy_focus.wav', rainy)
          write_track('deep_focus.wav', deep)

          b=open('assets/parin_litner_icon.png','rb').read(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
          pos=8
          while pos<len(b):
              n=struct.unpack('>I',b[pos:pos+4])[0]; t=b[pos+4:pos+8]; end=pos+12+n; assert end<=len(b)
              assert zlib.crc32(t+b[pos+8:pos+8+n])&0xffffffff==struct.unpack('>I',b[pos+8+n:pos+12+n])[0]
              pos=end
              if t==b'IEND': break
          print('Logo OK:',len(b))
          PY
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp assets/parin_litner_icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done

      - name: Enable network and native haptic permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = (
              '    <uses-permission android:name="android.permission.VIBRATE" />',
              '    <uses-permission android:name="android.permission.INTERNET" />',
          )
          for permission in permissions:
              permission_name = permission.split('"')[1]
              if permission_name not in text:
                  index = text.find('<application')
                  if index < 0:
                      raise SystemExit('Android manifest has no application node')
                  text = text[:index] + permission + '\n' + text[index:]
          path.write_text(text)
          print('VIBRATE and INTERNET permissions verified')
          PY

      - name: Verify Flutter minimum SDK (Android 7+)
        run: grep -Eq '^\s*minSdk = 24\s*$' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Verify versioned feature source
        run: |
          set -euo pipefail
          grep -Fq 'version: 7.3.0+23' pubspec.yaml
          grep -Fq 'image: 4.10.0' pubspec.yaml
          test -s lib/features/study/quick_review_page.dart
          test -s lib/features/quizzes/quizzes_page.dart
          test -s lib/core/services/quick_review_widget_service.dart
          grep -q 'QuickReviewWidgetProvider' .github/workflows/build-apk.yml
          grep -q "'quizzes': quizzes.map" lib/core/services/backup_service.dart
          grep -q 'QuizDefinition' lib/core/models/app_models.dart
          echo "Quick Review, configurable multiple-choice tests and portable test backup sources verified."

      - name: Release security hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text(errors='ignore') for p in Path('android').rglob('*.xml'))
          banned=['SYSTEM_ALERT_WINDOW','REQUEST_INSTALL_PACKAGES','QUERY_ALL_PACKAGES','MANAGE_EXTERNAL_STORAGE','READ_SMS','RECEIVE_SMS','SEND_SMS','BIND_ACCESSIBILITY_SERVICE','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','READ_CALL_LOG','WRITE_CALL_LOG','RECORD_AUDIO']
          bad=[x for x in banned if x in text]
          if bad: raise SystemExit('Unexpected sensitive permissions: '+', '.join(bad))
          print('No sensitive Android permissions declared.')
          PY
          grep -RniE 'SYSTEM_ALERT_WINDOW|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|READ_SMS|RECEIVE_SMS|SEND_SMS|BIND_ACCESSIBILITY_SERVICE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CALL_LOG|WRITE_CALL_LOG|RECORD_AUDIO' lib android || true

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          python3 - "$APK" "$AAB" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])
          aab = Path(sys.argv[2])

          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt APK entry: {bad}')
              names = set(z.namelist())
              if not any(name == 'classes.dex' or (name.startswith('classes') and name.endswith('.dex')) for name in names):
                  raise SystemExit('APK does not contain a dex file')
              for track in ('lofi_night.wav', 'rainy_focus.wav', 'deep_focus.wav'):
                  expected = f'assets/flutter_assets/assets/audio/{track}'
                  if expected not in names:
                      raise SystemExit(f'APK missing bundled audio asset: {expected}')

          with zipfile.ZipFile(aab) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt AAB entry: {bad}')
              names = set(z.namelist())
              required = 'base/manifest/AndroidManifest.xml'
              if required not in names:
                  raise SystemExit(f'AAB missing {required}')
              if not any(name.endswith('/assets/flutter_assets/assets/audio/lofi_night.wav') for name in names):
                  raise SystemExit('AAB missing bundled audio asset')

          print('ZIP structure and bundled audio verification: OK')
          PY

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK: $(du -h "$APK" | cut -f1)"
          echo "AAB: $(du -h "$AAB" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
 pubspec.yaml
          grep -q '^  image: 4.10.0' pubspec.yaml
          test -s lib/features/study/quick_review_page.dart
          test -s lib/features/quizzes/quizzes_page.dart
          test -s lib/core/services/quick_review_widget_service.dart
          grep -q 'QuickReviewWidgetProvider' .github/workflows/build-apk.yml
          grep -q "'quizzes': quizzes.map" lib/core/services/backup_service.dart
          grep -q 'QuizDefinition' lib/core/models/app_models.dart
          echo "Quick Review, configurable multiple-choice tests and portable test backup sources verified."

      - name: Release security hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text(errors='ignore') for p in Path('android').rglob('*.xml'))
          banned=['SYSTEM_ALERT_WINDOW','REQUEST_INSTALL_PACKAGES','QUERY_ALL_PACKAGES','MANAGE_EXTERNAL_STORAGE','READ_SMS','RECEIVE_SMS','SEND_SMS','BIND_ACCESSIBILITY_SERVICE','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','READ_CALL_LOG','WRITE_CALL_LOG','RECORD_AUDIO']
          bad=[x for x in banned if x in text]
          if bad: raise SystemExit('Unexpected sensitive permissions: '+', '.join(bad))
          print('No sensitive Android permissions declared.')
          PY
          grep -RniE 'SYSTEM_ALERT_WINDOW|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|READ_SMS|RECEIVE_SMS|SEND_SMS|BIND_ACCESSIBILITY_SERVICE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CALL_LOG|WRITE_CALL_LOG|RECORD_AUDIO' lib android || true

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          python3 - "$APK" "$AAB" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])
          aab = Path(sys.argv[2])

          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt APK entry: {bad}')
              names = set(z.namelist())
              if not any(name == 'classes.dex' or (name.startswith('classes') and name.endswith('.dex')) for name in names):
                  raise SystemExit('APK does not contain a dex file')
              for track in ('lofi_night.wav', 'rainy_focus.wav', 'deep_focus.wav'):
                  expected = f'assets/flutter_assets/assets/audio/{track}'
                  if expected not in names:
                      raise SystemExit(f'APK missing bundled audio asset: {expected}')

          with zipfile.ZipFile(aab) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt AAB entry: {bad}')
              names = set(z.namelist())
              required = 'base/manifest/AndroidManifest.xml'
              if required not in names:
                  raise SystemExit(f'AAB missing {required}')
              if not any(name.endswith('/assets/flutter_assets/assets/audio/lofi_night.wav') for name in names):
                  raise SystemExit('AAB missing bundled audio asset')

          print('ZIP structure and bundled audio verification: OK')
          PY

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK: $(du -h "$APK" | cut -f1)"
          echo "AAB: $(du -h "$AAB" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parin-litner-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
